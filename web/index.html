<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>viaEXIF · 自托管相机水印工具</title>
<meta name="description" content="viaEXIF —— 自托管的 EXIF 相机水印生成器：HEIC 实况照片与 30+ 种 RAW，经典白条与模糊边框两种模板，支持批量导出与分享链接。" />
<link rel="icon" type="image/svg+xml" href="/assets/viaexif.svg" />
<link rel="apple-touch-icon" href="/assets/viaexif.svg" />
<link rel="stylesheet" href="./css/style.css" />
<script>
  /* Resolve the theme before first paint, otherwise light-theme users see a dark flash. */
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q === "light" || q === "dark" ? q : localStorage.getItem("vx-theme") || "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <span class="grid-plane"></span>
  <span class="aurora a1"></span>
  <span class="aurora a2"></span>
  <span class="aurora a3"></span>
  <span class="grain"></span>
</div>

<header class="topbar">
  <div class="brand">
    <img class="mark" src="/assets/viaexif.svg" alt="" width="26" height="26" aria-hidden="true" />
    <span class="brand-name">viaEXIF</span>
    <span class="chip">self-host</span>
  </div>

  <div class="stats" title="本次会话">
    <span class="stat"><b id="statCount">0</b><em>张</em></span>
    <span class="stat-sep"></span>
    <span class="stat"><b id="statSize">0 MB</b></span>
    <span class="stat-sep"></span>
    <span class="stat"><b id="statExports">0</b><em>次导出</em></span>
  </div>

  <div class="topbar-actions">
    <button id="btnBatchMode" class="ghost" type="button" title="多选图片以启用批量导出">批量</button>
    <button id="btnTheme" class="ghost icon" type="button" title="切换主题" aria-label="切换主题">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
  </div>
</header>

<main class="layout">
  <!-- ============================ stage ============================ -->
  <section class="stage" id="stage">
    <div class="stage-scroll">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="preview" width="1200" height="800" hidden></canvas>
        <div class="dropzone" id="dropzone" tabindex="0" role="button">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v12"/>
          </svg>
          <p class="dz-title" id="dzTitle">拖拽或点击上传图片</p>
          <p class="dz-sub" id="dzSub">JPG / PNG / WEBP · HEIC / HEIF / AVIF · 30+ 种 RAW</p>
          <div class="dz-chips" aria-hidden="true">
            <span>HEIC / AVIF</span>
            <span>32 种 RAW</span>
            <span>实况照片</span>
            <span>批量 ZIP</span>
          </div>
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden />
        </div>
        <div class="dropveil" id="dropveil"><span>松开以上传</span></div>
        <div class="hud" id="hud" hidden>
          <div class="hud-line">
            <span class="hud-dot"></span>
            <span class="hud-label" id="hudLabel">正在解码…</span>
          </div>
          <div class="hud-track"><i id="hudFill"></i></div>
        </div>
      </div>
    </div>

    <div class="queue" id="queue" hidden></div>

    <div class="stage-bar">
      <div class="filemeta" id="fileMeta">尚未选择图片</div>
      <div class="stage-actions">
        <button id="btnReset" class="ghost" type="button" disabled>重置为 EXIF</button>
        <button id="btnReplace" class="ghost" type="button">更换图片</button>
      </div>
    </div>
  </section>

  <!-- ============================ panel ============================ -->
  <aside class="panel">
    <section class="card">
      <h3>水印模板</h3>
      <div class="tpl-grid" id="tplGrid"></div>
    </section>

    <section class="card">
      <h3>EXIF 信息</h3>
      <div class="field">
        <label for="brandBtn">相机品牌</label>
        <div class="select" id="brandSelect">
          <button type="button" id="brandBtn" class="select-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="brand-preview" id="brandPreview">Canon</span>
            <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8l5 5 5-5"/></svg>
          </button>
          <div class="select-menu" id="brandMenu" role="listbox" hidden>
            <input type="search" id="brandSearch" placeholder="搜索品牌…" />
            <div class="select-list" id="brandList"></div>
          </div>
        </div>
      </div>
      <div class="field-grid" id="fieldGrid"></div>
      <button id="btnApplyAll" class="ghost wide" type="button" hidden>把当前参数应用到全部图片</button>
    </section>

    <section class="card">
      <h3>水印设置</h3>
      <div id="sliderBox"></div>
    </section>

    <section class="card">
      <h3>导出</h3>
      <div class="seg" id="formatSeg"></div>
      <div class="field" id="qualityField">
        <label for="quality">画质 <span class="val" id="qualityVal">92%</span></label>
        <input type="range" id="quality" min="60" max="100" step="1" value="92" />
      </div>
      <div class="export-actions">
        <button id="btnDownload" class="primary" type="button" disabled>下载到本地</button>
        <button id="btnShare" class="secondary" type="button" disabled>生成分享链接</button>
      </div>
      <button id="btnZip" class="secondary wide" type="button" hidden>批量导出 ZIP（<span id="zipCount">0</span> 张）</button>
      <button id="btnLive" class="secondary wide" type="button" hidden>导出实况素材包（静图 + MOV）</button>
      <p class="hint" id="exportHint">导出不含任何限制，画质与原图一致。</p>
    </section>

    <p class="privacy">JPG / PNG / WEBP 全程在浏览器内渲染，不上传。HEIC 与 RAW 浏览器解不了，会经本机容器解码一次，原文件不落盘、解码帧 15 分钟后从内存清除。</p>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
